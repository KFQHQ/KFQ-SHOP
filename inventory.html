<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFQ Shop — Inventory Scan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #101214;
    --surface: #1B1E22;
    --surface-raised: #24282D;
    --border: #303539;
    --text: #EDEAE3;
    --text-dim: #9A9C9E;
    --accent: #3FD9C7;
    --warm: #E8963C;
    --danger: #E1553F;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1, h2 { margin: 0 0 4px; }

  .gate {
    max-width: 360px;
    margin: 100px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
  }
input,
select {
  width: 100%;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 1.05rem;
  margin: 10px 0;
}
  label { display: block; font-size: 0.8rem; color: var(--text-dim); margin: 12px 0 4px; }
  button {
    background: var(--accent);
    color: #0A2320;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 0.95rem;
    width: 100%;
  }
  button.secondary {
    background: var(--surface-raised);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.danger {
    background: var(--surface-raised);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button { flex: 1; }

  .error { color: #F3A99A; font-size: 0.85rem; margin-top: 8px; }
  .success { color: var(--accent); font-size: 0.85rem; margin-top: 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
  }
  .product-name { font-size: 1.2rem; font-weight: 700; }
  .product-flavor { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 10px; }
  .product-img {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    background: var(--surface-raised);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .active-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 14px 0;
    font-size: 0.9rem;
  }
  .active-toggle-row button {
    width: auto;
    padding: 7px 16px;
    font-size: 0.82rem;
  }
  .active-toggle-row button.is-active { background: var(--accent); color: #0A2320; }
  .active-toggle-row button.is-inactive { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value.low { color: var(--danger); font-weight: 700; }

  .mode-tabs { display: flex; gap: 8px; margin: 16px 0 10px; }
  .mode-tab {
    flex: 1;
    background: var(--surface-raised);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(63,217,199,0.1); }

  .preview { font-size: 0.9rem; color: var(--text-dim); margin: 8px 0 14px; }
  .preview strong { color: var(--text); }

  #scanner { margin: 14px 0; border-radius: 10px; overflow: hidden; }
  .hidden { display: none !important; }

  .count-session-banner {
    background: rgba(63,217,199,0.1);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .count-session-stats { display: flex; gap: 16px; font-size: 0.85rem; margin-bottom: 10px; flex-wrap: wrap; }
  .count-session-stats strong { color: var(--accent); }
  .count-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 16px; }
  .count-diff { font-size: 1.4rem; font-weight: 700; margin: 10px 0; }
  .count-diff.zero { color: var(--text-dim); }
  .count-diff.positive { color: var(--accent); }
  .count-diff.negative { color: var(--danger); }
  .summary-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 16px; text-align: center; }

  .new-item-form .field { margin-bottom: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 0.9rem; }
  .checkbox-row input { width: auto; margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="gate" id="gate">
    <h2>Inventory Scan</h2>
    <p style="color:var(--text-dim); font-size:0.85rem;">Owner access only.</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <button id="unlockBtn">Unlock</button>
    <div class="error" id="gateError"></div>
  </div>

  <div id="toolContent" class="hidden">
    <h1>Inventory Scan</h1>
    <p style="color:var(--text-dim); font-size:0.85rem;">Scan or type a SKU to look it up.</p>

    <label for="adminNameInput">Your name (required for the change log)</label>
    <input type="text" id="adminNameInput" placeholder="e.g. Yianni">

    <div id="countSessionBanner" class="count-session-banner hidden">
      <div class="count-session-stats">
        <span><strong id="countSessionCounted">0</strong> counted</span>
        <span><strong id="countSessionDiffs">0</strong> differences</span>
        <span><strong id="countSessionNet">0</strong> net units</span>
      </div>
      <button class="secondary" id="endCountSessionBtn">End Session</button>
    </div>
    <button class="secondary" id="startCountSessionBtn" style="margin-bottom:14px;">Start Physical Count Session</button>

    <label for="skuInput">SKU</label>
    <input type="text" id="skuInput" placeholder="e.g. TERPBLAST-KFQ" autofocus>
    <div class="btn-row">
      <button id="lookupBtn">Look Up</button>
      <button class="secondary" id="scanBtn">Scan</button>
    </div>
    <div id="scanner" class="hidden"></div>
    <div class="error" id="lookupError"></div>

    <div id="resultArea"></div>
  </div>

</div>

<script>
const API_BASE_URL = "https://script.google.com/macros/s/AKfycbyI11-tGxGJxri9xscd7fTE5PpPWYGz8gdiTd-dTVwatXdXGzGJIKurl_ljUyyjI-IAQg/exec";

let dashboardPassword = '';
let html5QrScanner = null;
let currentProduct = null;
let currentMode = 'add';
let countSession = null; // { sessionId, counted, diffs, net }
let currentCountItemType = 'store'; // which system the currently-displayed count item actually came from

async function apiPost(body) {
  const res = await fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return res.json();
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = String(value || '');
  return div.innerHTML;
}

// Same conversion used on the main storefront — turns a Drive "share" link
// into something actually viewable as an <img> src.
function toDriveDirectLink(url) {
  if (!url) return '';
  const match = String(url).match(/\/file\/d\/([^/]+)/);
  if (match) {
    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000';
  }
  return url;
}

/* ---------------- Password gate ---------------- */
async function unlock() {
  const pw = document.getElementById('passwordInput').value;
  const errorEl = document.getElementById('gateError');
  errorEl.textContent = '';

  const result = await apiPost({ action: 'getDashboardData', password: pw });
  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  dashboardPassword = pw;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('toolContent').classList.remove('hidden');

  const savedName = localStorage.getItem('kfq_inventory_admin_name');
  if (savedName) document.getElementById('adminNameInput').value = savedName;

  restoreCountSessionFromStorage();

  document.getElementById('skuInput').focus();
}

function saveCountSessionToStorage() {
  if (countSession) {
    localStorage.setItem('kfq_active_count_session', JSON.stringify(countSession));
  }
}

function restoreCountSessionFromStorage() {
  const saved = localStorage.getItem('kfq_active_count_session');
  if (!saved) return;
  try {
    countSession = JSON.parse(saved);
    updateCountSessionBanner();
    document.getElementById('countSessionBanner').classList.remove('hidden');
    document.getElementById('startCountSessionBtn').classList.add('hidden');
  } catch (e) {
    localStorage.removeItem('kfq_active_count_session');
  }
}

document.getElementById('adminNameInput').addEventListener('input', (e) => {
  localStorage.setItem('kfq_inventory_admin_name', e.target.value);
});

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

/* ---------------- Lookup ---------------- */
document.getElementById('lookupBtn').addEventListener('click', doLookup);
document.getElementById('skuInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLookup(); });

async function doLookup() {
  const sku = document.getElementById('skuInput').value.trim();
  const errorEl = document.getElementById('lookupError');
  errorEl.textContent = '';
  document.getElementById('resultArea').innerHTML = '';
  if (!sku) return;

  const result = await apiPost({ action: 'lookupProductForInventory', sku: sku, password: dashboardPassword });
  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  if (result.found) {
    currentProduct = result.product;
    currentCountItemType = 'store';
    if (countSession) {
      renderCountCard();
    } else {
      renderFoundProduct();
    }
    return;
  }

  // Not a store SKU — during an active count session, this is one
  // continuous session across both systems, so also check Internal
  // Inventory before giving up. Outside a session, stay scoped to Products
  // only, same as before.
  if (countSession) {
    const internalResult = await apiPost({ action: 'lookupInternalItem', sku: sku, password: dashboardPassword });
    if (!internalResult.error && internalResult.found) {
      currentProduct = internalResult.item;
      currentCountItemType = 'backstock';
      renderCountCard();
      return;
    }
  }

  renderNotFound(sku);
}

/* ---------------- Found: adjust quantity ---------------- */
function renderFoundProduct() {
  const p = currentProduct;
  currentMode = 'add';
  const isLow = p.quantity <= p.lowStockThreshold;
  const img = toDriveDirectLink(p.imageUrl);

  document.getElementById('resultArea').innerHTML = `
    <div class="card">
      ${img ? `<img src="${img}" alt="${escapeHtml(p.name)}" class="product-img">` : ''}
      <div class="product-name">${escapeHtml(p.name)}</div>
      <div class="product-flavor">${escapeHtml(p.flavor || '')}</div>
      <div class="stat-row"><span class="label">Current stock</span><span class="value ${isLow ? 'low' : ''}" id="currentQtyDisplay">${p.quantity}</span></div>
      <div class="stat-row"><span class="label">Low stock threshold</span><span>${p.lowStockThreshold}</span></div>
      <div class="stat-row"><span class="label">Price</span><span>$${Number(p.price).toFixed(2)}</span></div>

      <div class="active-toggle-row">
        <span>Status: <strong id="activeStatusText">${p.active ? 'Active' : 'Inactive'}</strong></span>
        <button id="toggleActiveBtn" class="${p.active ? 'is-active' : 'is-inactive'}">${p.active ? 'Deactivate' : 'Activate'}</button>
      </div>
      <div class="error" id="toggleActiveError"></div>

      <div class="mode-tabs" style="margin-top:16px;">
        <button class="mode-tab active" data-mode="add">Add</button>
        <button class="mode-tab" data-mode="remove">Remove</button>
        <button class="mode-tab" data-mode="set">Set exact</button>
      </div>

<label for="amountInput" id="amountLabel">Amount to add</label>
<input type="number" id="amountInput" min="0" placeholder="0">

<div class="preview" id="preview">
  New quantity will be <strong>${p.quantity}</strong>
</div>

<label for="reasonSelect">Reason <span style="color: var(--danger);">*</span></label>
<select id="reasonSelect">
  <option value="">Select a reason...</option>
  <option value="Restock">Restock</option>
  <option value="Damaged item">Damaged item</option>
  <option value="Personal use">Personal use</option>
  <option value="Correction">Correction</option>
  <option value="Physical count adjustment">Physical count adjustment</option>
  <option value="Other">Other</option>
</select>

<input
  type="text"
  id="reasonOtherInput"
  class="hidden"
  maxlength="160"
  placeholder="Describe the reason"
>

<button id="applyBtn">Apply</button>
<div class="error" id="applyError"></div>
<div class="success" id="applySuccess"></div>
    </div>
  `;

  document.getElementById('toggleActiveBtn').addEventListener('click', toggleActiveStatus);

  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      const labelMap = { add: 'Amount to add', remove: 'Amount to remove', set: 'New exact quantity' };
      document.getElementById('amountLabel').textContent = labelMap[currentMode];
      updatePreview();
    });
  });

 document.getElementById('amountInput').addEventListener('input', updatePreview);
document.getElementById('applyBtn').addEventListener('click', applyAdjustment);

document.getElementById('reasonSelect').addEventListener('change', (event) => {
  const otherInput = document.getElementById('reasonOtherInput');
  const isOther = event.target.value === 'Other';

  otherInput.classList.toggle('hidden', !isOther);

  if (!isOther) {
    otherInput.value = '';
  }
});
}

async function toggleActiveStatus() {
  const errorEl = document.getElementById('toggleActiveError');
  errorEl.textContent = '';
  const newActive = !currentProduct.active;

  const result = await apiPost({
    action: 'setProductActive',
    sku: currentProduct.sku,
    active: newActive,
    password: dashboardPassword
  });

  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  currentProduct.active = newActive;
  document.getElementById('activeStatusText').textContent = newActive ? 'Active' : 'Inactive';
  const btn = document.getElementById('toggleActiveBtn');
  btn.textContent = newActive ? 'Deactivate' : 'Activate';
  btn.className = newActive ? 'is-active' : 'is-inactive';
}

function updatePreview() {
  const amt = Number(document.getElementById('amountInput').value) || 0;
  let newQty = currentProduct.quantity;
  if (currentMode === 'add') newQty = currentProduct.quantity + amt;
  else if (currentMode === 'remove') newQty = Math.max(0, currentProduct.quantity - amt);
  else if (currentMode === 'set') newQty = amt;
  document.getElementById('preview').innerHTML = 'New quantity will be: <strong>' + newQty + '</strong>';
}

async function applyAdjustment() {
  const amt = document.getElementById('amountInput').value;
  const applyError = document.getElementById('applyError');
  const applySuccess = document.getElementById('applySuccess');

  applyError.textContent = '';
  applySuccess.textContent = '';

  const adminName = document.getElementById('adminNameInput').value.trim();
  const reasonSelected = document.getElementById('reasonSelect').value;
  const reasonOther = document.getElementById('reasonOtherInput').value.trim();

  const reason = reasonSelected === 'Other'
    ? reasonOther
    : reasonSelected;

  if (amt === '' || Number(amt) < 0) {
    applyError.textContent = 'Enter a valid amount.';
    return;
  }

  if (!adminName) {
    applyError.textContent = 'Enter your name at the top of the page first.';
    return;
  }

  if (!reason) {
    applyError.textContent = 'Select a reason or describe one if you chose Other.';
    return;
  }

  const result = await apiPost({
    action: 'adjustInventoryQuantity',
    sku: currentProduct.sku,
    mode: currentMode,
    amount: amt,
    reason: reason,
    admin: adminName,
    password: dashboardPassword
  });

  if (result.error) {
    applyError.textContent = result.error;
    return;
  }

  applySuccess.textContent = 'Updated — new quantity: ' + result.quantity;
  currentProduct.quantity = result.quantity;
  document.getElementById('currentQtyDisplay').textContent = result.quantity;
  document.getElementById('amountInput').value = '';
  document.getElementById('reasonSelect').value = '';
  document.getElementById('reasonOtherInput').value = '';
  document.getElementById('reasonOtherInput').classList.add('hidden');

  updatePreview();

  setTimeout(() => {
    document.getElementById('skuInput').value = '';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('skuInput').focus();
  }, 1400);
}

/* ---------------- Not found: add new item ---------------- */
function renderNotFound(sku) {
  document.getElementById('resultArea').innerHTML = `
    <div class="card">
      <p>SKU <strong>${escapeHtml(sku)}</strong> was not found.</p>
      <p style="color:var(--text-dim); font-size:0.85rem;">Add it as a new product?</p>
      <div class="btn-row">
        <button id="addNewYesBtn">Yes, add it</button>
        <button class="secondary" id="addNewNoBtn">No</button>
      </div>
      <div id="newItemFormArea"></div>
    </div>
  `;
  document.getElementById('addNewNoBtn').addEventListener('click', () => {
    document.getElementById('resultArea').innerHTML = '';
  });
  document.getElementById('addNewYesBtn').addEventListener('click', () => renderNewItemForm(sku));
}

function renderNewItemForm(sku) {
  document.getElementById('newItemFormArea').innerHTML = `
    <div class="new-item-form">
      <label>Product Name</label>
      <input type="text" id="newName">
      <label>Flavor</label>
      <input type="text" id="newFlavor">
      <label>Price</label>
      <input type="number" id="newPrice" min="0" step="0.01">
      <label>Initial Quantity</label>
      <input type="number" id="newQuantity" min="0" value="0">
      <label>Low Stock Threshold</label>
      <input type="number" id="newThreshold" min="0" value="5">
      <label>Image URL (optional)</label>
      <input type="text" id="newImageUrl">
      <div class="checkbox-row">
        <input type="checkbox" id="newActive">
        <label style="margin:0;">Active (visible on the storefront) — off by default</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="newSecret">
        <label style="margin:0;">Secret listing</label>
      </div>
      <button id="submitNewItemBtn" style="margin-top:10px;">Add Product</button>
      <div class="error" id="newItemError"></div>
      <div class="success" id="newItemSuccess"></div>
    </div>
  `;
  document.getElementById('submitNewItemBtn').addEventListener('click', () => submitNewItem(sku));
}

async function submitNewItem(sku) {
  const errorEl = document.getElementById('newItemError');
  const successEl = document.getElementById('newItemSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  const name = document.getElementById('newName').value.trim();
  if (!name) {
    errorEl.textContent = 'Product name is required.';
    return;
  }

  const fields = {
    sku: sku,
    name: name,
    flavor: document.getElementById('newFlavor').value.trim(),
    price: document.getElementById('newPrice').value,
    quantity: document.getElementById('newQuantity').value,
    lowStockThreshold: document.getElementById('newThreshold').value,
    imageUrl: document.getElementById('newImageUrl').value.trim(),
    active: document.getElementById('newActive').checked,
    secret: document.getElementById('newSecret').checked
  };

  const result = await apiPost({ action: 'addNewInventoryItem', fields: fields, password: dashboardPassword });
  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  successEl.textContent = 'Added! You can now scan it normally.';
  setTimeout(() => {
    document.getElementById('skuInput').value = '';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('skuInput').focus();
  }, 1400);
}

/* ---------------- Camera scanning ---------------- */
document.getElementById('scanBtn').addEventListener('click', toggleScanner);

function toggleScanner() {
  const scannerEl = document.getElementById('scanner');
  if (html5QrScanner) {
    stopScanner();
    return;
  }
  scannerEl.classList.remove('hidden');
  html5QrScanner = new Html5Qrcode('scanner');
  html5QrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    (decodedText) => {
      document.getElementById('skuInput').value = decodedText.trim();
      stopScanner();
      doLookup();
    },
    () => { /* ignore per-frame scan misses */ }
  ).catch(err => {
    document.getElementById('lookupError').textContent = 'Could not start camera: ' + err;
    scannerEl.classList.add('hidden');
    html5QrScanner = null;
  });
}

function stopScanner() {
  if (!html5QrScanner) return;
  html5QrScanner.stop().then(() => {
    html5QrScanner.clear();
    html5QrScanner = null;
    document.getElementById('scanner').classList.add('hidden');
  }).catch(() => {
    html5QrScanner = null;
    document.getElementById('scanner').classList.add('hidden');
  });
}

/* ------------------------------------------------------------------------
   Physical-count inventory session
   ------------------------------------------------------------------------ */
document.getElementById('startCountSessionBtn').addEventListener('click', async () => {
  const adminName = document.getElementById('adminNameInput').value.trim();
  const errorEl = document.getElementById('lookupError');
  errorEl.textContent = '';

  if (!adminName) {
    errorEl.textContent = 'Enter your name before starting a count session.';
    return;
  }

  const result = await apiPost({ action: 'startCountSession', admin: adminName, password: dashboardPassword });
  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  countSession = { sessionId: result.sessionId, counted: 0, diffs: 0, net: 0 };
  saveCountSessionToStorage();
  updateCountSessionBanner();
  document.getElementById('countSessionBanner').classList.remove('hidden');
  document.getElementById('startCountSessionBtn').classList.add('hidden');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('skuInput').value = '';
  document.getElementById('skuInput').focus();
});

document.getElementById('endCountSessionBtn').addEventListener('click', async () => {
  if (!countSession) return;
  const result = await apiPost({ action: 'endCountSession', sessionId: countSession.sessionId, password: dashboardPassword });
  if (result.error) {
    document.getElementById('lookupError').textContent = result.error;
    return;
  }

  localStorage.removeItem('kfq_active_count_session');
  document.getElementById('countSessionBanner').classList.add('hidden');
  document.getElementById('startCountSessionBtn').classList.remove('hidden');
  document.getElementById('resultArea').innerHTML = `
    <div class="summary-panel">
      <h2 style="font-size:1.1rem;">Count session complete</h2>
      <p style="color:var(--text-dim); font-size:0.85rem;">${result.sessionId}</p>
      <div class="stat-row"><span class="label">Products counted</span><span>${result.productsCounted}</span></div>
      <div class="stat-row"><span class="label">Differences found</span><span>${result.differencesFound}</span></div>
      <div class="stat-row"><span class="label">Net units adjusted</span><span>${result.netUnitsAdjusted}</span></div>
    </div>
  `;
  countSession = null;
});

function updateCountSessionBanner() {
  if (!countSession) return;
  document.getElementById('countSessionCounted').textContent = countSession.counted;
  document.getElementById('countSessionDiffs').textContent = countSession.diffs;
  document.getElementById('countSessionNet').textContent = (countSession.net > 0 ? '+' : '') + countSession.net;
}

function renderCountCard() {
  const p = currentProduct;
  const subLabel = currentCountItemType === 'backstock' ? (p.category || '') : (p.flavor || '');
  const typeBadge = currentCountItemType === 'backstock' ? 'Backstock' : 'Store';
  document.getElementById('resultArea').innerHTML = `
    <div class="count-card">
      <div class="stat-row" style="border-bottom:none; padding-bottom:0;"><span class="label"></span><span style="color:var(--accent); font-size:0.75rem; font-weight:700; text-transform:uppercase;">${typeBadge}</span></div>
      <div class="product-name">${escapeHtml(p.name)}</div>
      <div class="product-flavor">${escapeHtml(subLabel)}</div>
      <div class="stat-row"><span class="label">Sheet quantity</span><span>${p.quantity}</span></div>

      <label for="physicalCountInput">Physical count</label>
      <input type="number" id="physicalCountInput" min="0" placeholder="Enter what you actually counted">
      <div class="count-diff zero" id="countDiffPreview">Difference: 0</div>

      <button id="recordCountBtn">Record Count</button>
      <div class="error" id="countError"></div>
      <div class="success" id="countSuccess"></div>
    </div>
  `;

  const input = document.getElementById('physicalCountInput');
  input.addEventListener('input', () => {
    const physical = Number(input.value);
    const diff = (input.value === '') ? 0 : physical - p.quantity;
    const diffEl = document.getElementById('countDiffPreview');
    diffEl.textContent = 'Difference: ' + (diff > 0 ? '+' : '') + diff;
    diffEl.className = 'count-diff ' + (diff === 0 ? 'zero' : diff > 0 ? 'positive' : 'negative');
  });
  input.focus();

  document.getElementById('recordCountBtn').addEventListener('click', submitCount);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCount(); });
}

async function submitCount() {
  const physicalCount = document.getElementById('physicalCountInput').value;
  const errorEl = document.getElementById('countError');
  const successEl = document.getElementById('countSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  if (physicalCount === '' || Number(physicalCount) < 0) {
    errorEl.textContent = 'Enter a valid count.';
    return;
  }

  const adminName = document.getElementById('adminNameInput').value.trim();

  const result = await apiPost({
    action: 'recordCount',
    sessionId: countSession.sessionId,
    inventoryType: currentCountItemType,
    sku: currentProduct.sku,
    physicalCount: physicalCount,
    admin: adminName,
    password: dashboardPassword
  });

  if (result.error) {
    errorEl.textContent = result.error;
    return;
  }

  countSession.counted++;
  if (result.adjusted) countSession.diffs++;
  countSession.net += result.difference;
  saveCountSessionToStorage();
  updateCountSessionBanner();

  successEl.textContent = result.adjusted
    ? 'Recorded — adjusted by ' + (result.difference > 0 ? '+' : '') + result.difference
    : 'Recorded — matched, no adjustment needed';

  setTimeout(() => {
    document.getElementById('skuInput').value = '';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('skuInput').focus();
  }, 1100);
}
</script>
</body>
</html>
